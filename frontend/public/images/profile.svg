<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="600" height="600" fill="url(#bgGlow)" />
  
  <!-- Subtle futuristic grid lines -->
  <g stroke="rgba(59, 130, 246, 0.12)" stroke-width="1">
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="450" x2="600" y2="450" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
  </g>

  <!-- Orbital tech rings -->
  <circle cx="300" cy="270" r="170" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="300" cy="270" r="195" fill="none" stroke="url(#neonViolet)" stroke-width="1.5" stroke-dasharray="6 14" opacity="0.5" />

  <!-- Developer Silhouette with Tech Aura -->
  <g filter="url(#shadowGlow)">
    <!-- Shoulders / Torso -->
    <path d="M 160 540 C 160 410, 230 380, 300 380 C 370 380, 440 410, 440 540 Z" fill="#111827" stroke="url(#neonCyan)" stroke-width="3" />
    
    <!-- Neck -->
    <rect x="275" y="320" width="50" height="70" rx="8" fill="#1f2937" />
    
    <!-- Head / Face Silhouette -->
    <ellipse cx="300" cy="245" rx="85" ry="105" fill="#111827" stroke="url(#neonViolet)" stroke-width="3" />
    
    <!-- Cyber Visor / Neural Interface -->
    <rect x="240" y="215" width="120" height="28" rx="14" fill="#030712" stroke="url(#neonCyan)" stroke-width="2.5" />
    <line x1="250" y1="229" x2="350" y2="229" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <circle cx="300" cy="229" r="4" fill="#38bdf8" />
  </g>

  <!-- AI Nodes & Constellation -->
  <g fill="#22d3ee">
    <circle cx="160" cy="180" r="5" />
    <circle cx="440" cy="180" r="5" />
    <circle cx="120" cy="360" r="4" />
    <circle cx="480" cy="360" r="4" />
    <circle cx="300" cy="90" r="6" />
  </g>
  <g stroke="rgba(34, 211, 238, 0.4)" stroke-width="1.5">
    <line x1="300" y1="90" x2="160" y2="180" />
    <line x1="300" y1="90" x2="440" y2="180" />
    <line x1="160" y1="180" x2="240" y2="215" />
    <line x1="440" y1="180" x2="360" y2="215" />
  </g>

  <!-- Name / Tech Badge at bottom -->
  <rect x="150" y="520" width="300" height="48" rx="24" fill="rgba(15, 23, 42, 0.9)" stroke="url(#neonCyan)" stroke-width="1.5" />
  <text x="300" y="550" font-family="sans-serif" font-weight="bold" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    MAYAKUNTLA LAKSHMI VIJAYA
  </text>
</svg>